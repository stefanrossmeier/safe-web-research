[project]
name = "safe-web-research"
version = "0.1.0"
description = "Bounded, provenance-aware web research for AI systems"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ai", "agents", "research", "security", "prompt-injection", "ssrf"]
authors = [{ name = "stefanrossmeier" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
]

[project.urls]
Repository = "https://github.com/stefanrossmeier/safe-web-research"
Issues = "https://github.com/stefanrossmeier/safe-web-research/issues"

[project.scripts]
safe-web-research = "safe_web_research:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests requiring real external services",
    "integration: integration tests",
    "adversarial: adversarial security tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["safe_web_research"]
