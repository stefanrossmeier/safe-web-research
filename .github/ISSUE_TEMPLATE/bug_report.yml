name: Bug report
description: Report a reproducible problem in safe-web-research.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, secrets, or private data.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command, input, or test case that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS/Linux, Python 3.12.x, uv version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Redact credentials and other sensitive values.
      render: text
